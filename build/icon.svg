<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Euphorbia 'Sotetsukirin' (괴마옥), one colour: an egg-shaped body, wide at
       the base, covered in pointed tubercles in a diamond lattice, with a small
       tuft of thin leaves at the tip. Details are cut out. -->
  <defs>
    <pattern id="tub" width="92" height="64" patternUnits="userSpaceOnUse" x="20" y="14">
      <!-- grooves between tubercles -->
      <path d="M46 0 L92 32 L46 64 L0 32 Z" fill="none" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
      <!-- each tubercle's pointed tip -->
      <path d="M46 12 L54 24 L46 30 L38 24 Z" fill="#000"/>
      <path d="M0 44 L8 56 L0 62 L-8 56 Z M92 44 L100 56 L92 62 L84 56 Z" fill="#000"/>
    </pattern>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="250" y="300" width="524" height="680" fill="url(#tub)"/>
    </mask>
  </defs>
  <g fill="#2f5d3a">
    <!-- leaf tuft: short, needle-thin, fanning from the tip -->
    <g stroke="#2f5d3a" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M502 318 C482 270 452 244 412 232"/>
      <path d="M522 318 C542 270 572 244 612 232"/>
      <path d="M506 314 C496 262 478 222 452 192"/>
      <path d="M518 314 C528 262 546 222 572 192"/>
      <path d="M512 312 C510 262 512 214 518 168"/>
      <path d="M498 324 C468 300 430 294 394 300"/>
      <path d="M526 324 C556 300 594 294 630 300"/>
    </g>
    <!-- body: egg shape, narrow top, broad base -->
    <path mask="url(#cut)" d="M512 300 C610 300 662 400 696 520 C740 670 760 800 720 880 C690 940 610 960 512 960 C414 960 334 940 304 880 C264 800 284 670 334 520 C362 400 414 300 512 300 Z"/>
  </g>
</svg>
