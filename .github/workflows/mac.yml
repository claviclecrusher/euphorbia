# Builds the macOS app (universal: Intel and Apple Silicon) on a GitHub macOS
# runner and attaches it to the release. There is no Apple developer account,
# so the app has only an ad-hoc signature: it updates by notification, and
# the first start needs "Open Anyway" (see README).
#
# Runs when a release is published, or by hand for a tag (also for a draft
# release: give its tag name, e.g. v0.24.0, and the branch it was built from).
name: macOS build

on:
  release:
    types: [published]
  # Build check for the branch that adds this workflow (no upload).
  push:
    branches: [worktree-mac]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to (e.g. v0.24.0)
        required: true
      ref:
        description: Branch or commit to build (default: the tag)
        required: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.sha || inputs.ref || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Keep the build (branch check)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: euphorbia-mac
          path: |
            dist/*-mac.dmg
            dist/*-mac.zip
            dist/latest-mac.yml
      - name: Attach to the release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          ls dist
          gh release upload "$TAG" dist/*-mac.dmg dist/*-mac.zip dist/latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
