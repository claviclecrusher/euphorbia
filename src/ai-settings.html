<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>AI Settings</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; padding: 22px 26px; background: #f4f5f6; color: #1b222c; font-size: 13px; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p.lead { color: #495365; margin: 0 0 14px; line-height: 1.5; }
  fieldset { border: 1px solid #d5d9df; border-radius: 8px; background: #fff; margin: 0 0 12px; padding: 10px 14px 12px; }
  legend { font-weight: 600; padding: 0 4px; }
  label.f { display: block; font-size: 12px; color: #495365; margin: 8px 0 3px; }
  input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: 7px 9px; font-size: 13px;
    border: 1px solid #afb5c0; border-radius: 6px; font-family: inherit; }
  textarea { height: 64px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input { flex: 1; }
  .state { font-size: 11px; color: #495365; white-space: nowrap; }
  .tools { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .tools .out { flex: 1; font-size: 12px; white-space: pre-wrap; }
  button { padding: 6px 13px; font-size: 12px; border: 0; border-radius: 16px; cursor: pointer; background: #e4e7eb; color: #1b222c; }
  button.primary { background: #098842; color: #fff; padding: 8px 18px; font-size: 13px; }
  button.link { background: none; color: #0f6fc5; padding: 0 4px; }
  button:disabled { opacity: .6; cursor: default; }
  .actions { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .actions .spacer { flex: 1; }
  .note { font-size: 11px; color: #6b7280; margin-top: 4px; }
  .ok { color: #098842; } .err { color: #b83a33; }
</style>
</head>
<body>
  <h1>AI Settings</h1>
  <p class="lead">Set up the connections here. The models you list appear in the model menus of
    <b>Ctrl+K</b> and the AI chat panel. Keys are stored on this computer only.</p>

  <fieldset data-p="claude">
    <legend>Claude (Anthropic)</legend>
    <label class="f">API key</label>
    <div class="row"><input data-k="key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
      <span class="state" data-k="state"></span><button class="link" data-a="clear" type="button">Remove</button></div>
    <label class="f">Models (one per line)</label>
    <textarea data-k="models" spellcheck="false"></textarea>
    <div class="tools"><button data-a="fetch" type="button">Fetch model list</button><button data-a="test" type="button">Save &amp; Test</button><span class="out" data-k="out"></span></div>
  </fieldset>

  <fieldset data-p="openai">
    <legend>OpenAI</legend>
    <label class="f">API key</label>
    <div class="row"><input data-k="key" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <span class="state" data-k="state"></span><button class="link" data-a="clear" type="button">Remove</button></div>
    <label class="f">Models (one per line)</label>
    <textarea data-k="models" spellcheck="false" placeholder="use Fetch model list after entering the key"></textarea>
    <div class="tools"><button data-a="fetch" type="button">Fetch model list</button><button data-a="test" type="button">Save &amp; Test</button><span class="out" data-k="out"></span></div>
  </fieldset>

  <fieldset data-p="local">
    <legend>Local model (OpenAI-compatible server)</legend>
    <label class="f">Server address</label>
    <input data-k="baseURL" type="text" spellcheck="false" placeholder="http://localhost:11434/v1">
    <div class="note">Ollama: http://&lt;host&gt;:11434/v1 &middot; LM Studio: http://&lt;host&gt;:1234/v1</div>
    <label class="f">Models (one per line)</label>
    <textarea data-k="models" spellcheck="false" placeholder="e.g. qwen3.6:35b"></textarea>
    <label class="f">API key (only if the server needs one)</label>
    <div class="row"><input data-k="key" type="password" autocomplete="off" spellcheck="false">
      <span class="state" data-k="state"></span><button class="link" data-a="clear" type="button">Remove</button></div>
    <div class="tools"><button data-a="fetch" type="button">Fetch model list</button><button data-a="test" type="button">Save &amp; Test</button><span class="out" data-k="out"></span></div>
  </fieldset>

  <div class="note" id="enc"></div>
  <div class="actions">
    <span class="spacer"></span>
    <span id="msg"></span>
    <button id="cancel" type="button">Close</button>
    <button class="primary" id="save" type="button">Save</button>
  </div>

<script>
  const P = ['claude', 'openai', 'local'];
  const fs = (p) => document.querySelector(`fieldset[data-p="${p}"]`);
  const el = (p, k) => fs(p).querySelector(`[data-k="${k}"]`);
  const clear = { claude: false, openai: false, local: false };

  function show(s) {
    for (const p of P) {
      el(p, 'models').value = (s[p].models || []).join('\n');
      el(p, 'key').value = '';
      el(p, 'state').textContent = s[p].hasKey ? 'saved' : 'not set';
      if (p === 'local') el(p, 'baseURL').value = s[p].baseURL || '';
      clear[p] = false;
    }
    document.getElementById('enc').textContent = s.encrypted ? 'Keys are encrypted with the system keychain.'
      : 'No system keychain is available: keys are stored unencrypted in the app settings file.';
  }

  function form() {
    const f = {};
    for (const p of P) {
      f[p] = { models: el(p, 'models').value, key: el(p, 'key').value, clearKey: clear[p] };
      if (p === 'local') f[p].baseURL = el(p, 'baseURL').value;
    }
    return f;
  }

  const out = (p, text, cls) => { const o = el(p, 'out'); o.className = 'out ' + (cls || ''); o.textContent = text; };

  for (const p of P) {
    fs(p).querySelector('[data-a="clear"]').addEventListener('click', () => {
      clear[p] = true; el(p, 'key').value = ''; el(p, 'state').textContent = 'will be removed';
    });
    fs(p).querySelector('[data-a="fetch"]').addEventListener('click', async () => {
      out(p, 'Fetching…');
      const res = await window.aiSettings.models(form(), p);
      if (!res.ok) return out(p, res.error, 'err');
      const have = new Set(el(p, 'models').value.split('\n').map((s) => s.trim()).filter(Boolean));
      const add = res.models.filter((m) => !have.has(m));
      if (!have.size && res.models.length) el(p, 'models').value = res.models.join('\n');
      out(p, `${res.models.length} model(s) on the server${have.size && add.length ? `; not in your list: ${add.slice(0, 12).join(', ')}${add.length > 12 ? ', …' : ''}` : ''}`, 'ok');
    });
    fs(p).querySelector('[data-a="test"]').addEventListener('click', async (e) => {
      e.target.disabled = true; out(p, 'Saving and sending a test request…');
      const res = await window.aiSettings.test(form(), p);
      e.target.disabled = false;
      if (res.ok) { show(res.settings); out(p, `Works (${res.by}): ${res.sample}`, 'ok'); } else out(p, res.error, 'err');
    });
  }

  document.getElementById('save').addEventListener('click', async () => {
    const res = await window.aiSettings.save(form());
    const m = document.getElementById('msg');
    if (res.ok) { show(res.settings); m.className = 'ok'; m.textContent = 'Saved.'; } else { m.className = 'err'; m.textContent = res.error; }
  });
  document.getElementById('cancel').addEventListener('click', () => window.aiSettings.close());
  window.aiSettings.get().then(show);
</script>
</body>
</html>
