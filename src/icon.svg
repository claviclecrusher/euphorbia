<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Euphorbia 'Sotetsukirin' (괴마옥), one colour: an egg-shaped body, wide at
       the base, covered in pointed tubercles in a diamond lattice, with a small
       tuft of thin leaves at the tip. Details are cut out. -->
  <defs>
    <pattern id="tub" width="92" height="64" patternUnits="userSpaceOnUse" x="20" y="14">
      <!-- grooves between tubercles -->
      <path d="M46 0 L92 32 L46 64 L0 32 Z" fill="none" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
      <!-- each tubercle's pointed tip -->
      <path d="M46 12 L54 24 L46 30 L38 24 Z" fill="#000"/>
      <path d="M0 44 L8 56 L0 62 L-8 56 Z M92 44 L100 56 L92 62 L84 56 Z" fill="#000"/>
    </pattern>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="250" y="300" width="524" height="680" fill="url(#tub)"/>
    </mask>
  </defs>
  <g fill="#2f5d3a">
    <!-- leaves: short, narrow, filled, reaching upward from the tip -->
    <path d="M494 352 C440 300 370 260 296 238 C376 226 450 262 510 336 Z"/>
    <path d="M530 352 C584 300 654 260 728 238 C648 226 574 262 514 336 Z"/>
    <path d="M498 346 C462 276 410 214 350 168 C430 184 486 250 520 334 Z"/>
    <path d="M526 346 C562 276 614 214 674 168 C594 184 538 250 504 334 Z"/>
    <path d="M504 342 C484 268 462 196 426 128 C490 170 518 250 524 334 Z"/>
    <path d="M520 342 C540 268 562 196 598 128 C534 170 506 250 500 334 Z"/>
    <path d="M512 340 C490 270 492 180 512 100 C532 180 534 270 512 340 Z"/>
    <!-- body: between an egg and an upright oval, fuller towards the base -->
    <path mask="url(#cut)" d="M512 320 C615 320 676 420 698 560 C722 720 720 860 690 915 C660 955 600 955 512 955 C424 955 364 955 334 915 C304 860 302 720 326 560 C348 420 409 320 512 320 Z"/>
  </g>
</svg>
