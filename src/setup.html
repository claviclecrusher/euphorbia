<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>서버 추가</title>
<style>
  body { font-family: system-ui, "Segoe UI", "Noto Sans KR", sans-serif; margin: 0; padding: 28px 32px;
         background: #f4f5f6; color: #1b222c; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 13px; color: #495365; margin: 0 0 16px; line-height: 1.5; }
  label { display: block; font-size: 12px; color: #495365; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px;
          border: 1px solid #afb5c0; border-radius: 6px; }
  input:focus { outline: 2px solid #098842; border-color: transparent; }
  button { padding: 10px 20px; font-size: 14px; border: 0; border-radius: 20px;
           background: #098842; color: #fff; cursor: pointer; }
  button:disabled { background: #8bb89f; cursor: default; }
  button.link { background: none; color: #0f6fc5; padding: 0; font-size: 13px; border-radius: 0; }
  .row { margin-top: 18px; display: flex; align-items: center; gap: 16px; }
  #msg { margin-top: 14px; font-size: 13px; min-height: 18px; color: #b83a33; }
</style>
</head>
<body>
  <h1>Overleaf 서버 추가</h1>
  <p>접속할 Overleaf 서버의 주소를 입력하세요. 직접 운영하는 서버(예: <code>http://192.168.50.108</code>)와
     overleaf.com 모두 쓸 수 있습니다.</p>
  <form id="form">
    <label for="url">서버 주소</label>
    <input id="url" type="text" placeholder="http://서버주소" autofocus spellcheck="false">
    <label for="name">이름 (선택)</label>
    <input id="name" type="text" placeholder="비워 두면 주소로 표시" maxlength="40" spellcheck="false">
    <div class="row">
      <button id="btn" type="submit">연결</button>
      <button id="official" type="button" class="link">overleaf.com 입력</button>
    </div>
  </form>
  <div id="msg"></div>
<script>
  const url = document.getElementById('url');
  const name = document.getElementById('name');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  document.getElementById('official').addEventListener('click', () => {
    url.value = 'https://www.overleaf.com';
    if (!name.value) name.value = 'Overleaf';
    url.focus();
  });
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.style.color = '#495365';
    msg.textContent = '서버 확인 중…';
    const res = await window.setup.save({ url: url.value, name: name.value });
    if (!res.ok) {
      msg.style.color = '#b83a33';
      msg.textContent = res.error;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
